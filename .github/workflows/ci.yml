name: CI
on:
  push:
    branches:
      - main
      - revizlify
      - 'temp-*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - revizlify
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
permissions: {}
jobs:
  check-latest-versions:
    permissions:
      contents: read
    runs-on: 'ubuntu-26.04'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./check-latest-versions.sh && git diff --quiet
  build:
    permissions:
      contents: read
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: check-latest-versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'ubuntu-26.04'
            platform: 'linux-x64'
          - os: 'ubuntu-24.04-arm'
            platform: 'linux-arm64v8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          pipx install meson
          brew install automake nasm
      - name: Build ${{ matrix.platform }}
        run: ./build.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.platform }}
          path: '*.tar.gz'
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  populate-and-publish-npm-workspace:
    permissions:
      contents: write
      id-token: write
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - name: Populate npm workspace
        run: ./populate-npm-workspace.sh
      - name: Create npm workspace tarball
        run: tar -vcaf npm-workspace.tar.xz -C npm .
      - name: Generate release notes
        run: ./generate-release-notes.sh
      - name: Create GitHub release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          artifacts: npm-workspace.tar.xz
          artifactContentType: application/x-xz
          bodyFile: release-notes.md
          prerelease: ${{ contains(github.ref, '-rc') }}
          makeLatest: ${{ !contains(github.ref, '-rc') }}
      - name: Publish npm packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd npm && npm publish --provenance --workspaces --tag=${{ contains(github.ref, '-rc') && 'next' || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
